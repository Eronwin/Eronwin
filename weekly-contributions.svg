    .axis { fill: #9aa5ce; font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #292e42; stroke-width: 1; }
  </style>
  <rect width="820" height="260" rx="14" fill="#1a1b27" />
