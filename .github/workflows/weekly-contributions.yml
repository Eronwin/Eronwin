name: Profile Stats

on:
  schedule:
    # GitHub cron uses UTC. 22:30 UTC is 06:30 in Asia/Shanghai.
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=eronwin&theme=tokyonight&hide_border=true&mode=daily&starting_year=2026&date_format=[Y.]n.j
          path: streak-stats.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}

      - name: Generate weekly contribution chart
        run: node .github/scripts/generate-weekly-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          GITHUB_USERNAME: eronwin
          WEEK_COUNT: 12
          STREAK_LOOKBACK_WEEKS: 16

      - name: Commit chart
        run: |
          if [ -n "$(git status --porcelain streak-stats.svg weekly-contributions.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add streak-stats.svg weekly-contributions.svg
            git commit -m "Update profile stats - [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
